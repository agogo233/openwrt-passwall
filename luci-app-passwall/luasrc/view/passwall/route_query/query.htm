<%
local map = self.map
local api = map.api
-%>

<style>
	.rq-box {
		display: flex;
		gap: 8px;
		align-items: center;
		flex-wrap: wrap;
		margin-bottom: 10px;
	}
	.rq-box input, .rq-box select {
		min-width: 180px;
	}
	.rq-sec {
		margin-bottom: 12px;
	}
	.rq-card {
		border: 1px solid var(--border-color, #ccc);
		border-radius: 4px;
		padding: 8px 12px;
		margin-top: 8px;
		background: var(--main-bg, #fff);
	}
	.rq-title {
		font-weight: bold;
		margin-bottom: 6px;
		display: inline-block;
	}
	.rq-badge {
		display: inline-block;
		padding: 1px 8px;
		border-radius: 10px;
		color: #fff;
		font-size: 12px;
		margin-left: 6px;
	}
	.rq-badge.direct { background: #2e7d32; }
	.rq-badge.proxy { background: #1565c0; }
	.rq-badge.block { background: #c62828; }
	.rq-badge.unknown { background: #f57c00; }
	.rq-detail { margin: 2px 0; font-size: 13px; word-break: break-all; }
	.rq-note { color: var(--text-dim, #888); font-size: 12px; margin: 2px 0; }
	.rq-rule-file { color: var(--text-dim, #888); }
	#rq_result { white-space: normal; }
</style>

<div class="cbi-value">
	<ul>
		<li><%:输入域名或 IP，查询它在系统级(透明代理)与代理客户端(分流)中的走向判定。%></li>
		<li class="rq-note"><%:说明：结果按默认规则判定，未计入针对单台设备(ACL)的独立规则。%></li>
	</ul>
</div>

<div class="cbi-value">
	<div class="cbi-value-field">
		<div class="rq-box">
			<input type="text" id="rq_target" class="cbi-input-text" placeholder="<%:域名或 IP，例如 www.google.com 或 8.8.8.8%>" inputmode="search" enterkeyhint="search" />
			<input type="text" id="rq_port" class="cbi-input-text" style="min-width:90px" placeholder="<%:端口(可选)%>" inputmode="numeric" />
			<select id="rq_proto" class="cbi-input-select" style="min-width:90px">
				<option value="tcp">TCP</option>
				<option value="udp">UDP</option>
			</select>
			<input class="btn cbi-button cbi-button-apply" type="button" id="rq_btn" value="<%:查询%>" />
		</div>
	</div>
</div>

<div id="rq_result">
	<div class="cbi-value rq-note"><%:点击「查询」开始。%></div>
</div>

<script type="text/javascript">
	//<![CDATA[
	const rq_target = document.getElementById("rq_target");
	const rq_port = document.getElementById("rq_port");
	const rq_proto = document.getElementById("rq_proto");
	const rq_btn = document.getElementById("rq_btn");

	function rqEsc(s) {
		var d = document.createElement("div");
		d.textContent = s == null ? "" : s;
		return d.innerHTML;
	}

	function rqBadge(decision) {
		var cls = "unknown", label;
		switch (decision) {
			case "direct": cls = "direct"; label = "<%:直连%>"; break;
			case "proxy":  cls = "proxy";  label = "<%:代理%>"; break;
			case "block":  cls = "block";  label = "<%:屏蔽%>"; break;
			default:       cls = "unknown"; label = "<%:未知%>"; break;
		}
		return '<span class="rq-badge ' + cls + '">' + label + "</span>";
	}

	function rqRenderSys(sys) {
		var decision = sys.decision || "unknown";
		var html = '<div class="rq-card" style="border-left:4px solid #2e7d32">';
		html += '<span class="rq-title"><%:系统级分流(透明代理)%></span>' + rqBadge(decision);
		if (sys.backend) html += '<span class="rq-rule-file">(' + rqEsc(sys.backend) + ")</span>";
		if (sys.matched) html += '<div class="rq-detail"><%:命中集合/列表%>: ' + rqEsc(sys.matched) + "</div>";
		if (sys.entry) html += '<div class="rq-detail"><%:匹配条目%>: ' + rqEsc(sys.entry) + "</div>";
		if (sys.note) html += '<div class="rq-note">' + rqEsc(sys.note) + "</div>";
		if (sys.resolved && sys.resolved.length > 0) {
			html += '<div class="rq-note"><%:域名解析后 IP 判定:%></div>';
			sys.resolved.forEach(function(r) {
				html += '<div class="rq-detail">' + rqEsc(r.ip) + " " + rqBadge(r.decision) + '</div>';
			});
		}
		if (sys.decision == null) html += '<div class="rq-note"><%:未匹配到任何域名规则，未做 IP 判定(解析失败/规则开关关闭)。%></div>';
		html += "</div>";
		return html;
	}

	function rqRenderClient(client) {
		var html = '<div class="rq-card" style="border-left:4px solid #1565c0">';
		html += '<span class="rq-title"><%:代理客户端分流%></span>';
		if (!client.available) {
			html += '<div class="rq-note">' + rqEsc(client.note || "N/A") + "</div>";
			html += "</div>";
			return html;
		}
		var decision = "proxy";
		var outbound = client.outbound;
		if (outbound === "direct" || outbound === "direct_outbound") decision = "direct";
		else if (outbound === "block" || outbound === "blackhole" || outbound === null) decision = "block";
		html += rqBadge(decision) + '<span class="rq-rule-file">(' + rqEsc(client.core) + ")</span>";
		if (client.rule) html += '<div class="rq-detail"><%:命中规则%>: ' + rqEsc(client.rule) + "</div>";
		html += '<div class="rq-detail"><%:出口%>: ' + rqEsc(outbound || "N/A") + "</div>";
		if (client.final) html += '<div class="rq-note"><%:未命中前置规则，按兜底出口。%></div>';
		if (client.note) html += '<div class="rq-note">' + rqEsc(client.note) + "</div>";
		html += "</div>";
		return html;
	}

	function rqRun() {
		var target = rq_target.value.trim();
		if (!target) {
			alert("<%:请输入域名或 IP 地址！%>");
			return;
		}
		var port = rq_port.value.trim();
		var proto = rq_proto.value;
		rq_btn.disabled = true;
		rq_btn.value = "<%:查询中%>";
		var url = '<%= api.url("route_query_action") %>?target=' + encodeURIComponent(target)
			+ "&port=" + encodeURIComponent(port)
			+ "&proto=" + encodeURIComponent(proto);
		fetch(url)
			.then(function(resp) { return resp.json(); })
			.then(function(data) {
				var out = document.getElementById("rq_result");
				if (data.code === 0) {
					out.innerHTML = '<div class="cbi-value rq-note" style="color:red">' + rqEsc(data.message) + "</div>";
					return;
				}
				var html = '<div class="rq-sec">';
				html += '<div class="rq-detail"><b>' + rqEsc(data.target) + "</b>"
					+ ' (' + rqEsc(data.type)
					+ (data.family ? ', ' + rqEsc(data.family) : "")
					+ ")"
					+ (data.port ? ' :' + rqEsc(data.port) : "")
					+ ' / ' + rqEsc(data.proto.toUpperCase()) + "</div>";
				html += "</div>";
				html += '<div class="rq-sec">' + rqRenderSys(data.system) + "</div>";
				html += '<div class="rq-sec">' + rqRenderClient(data.client) + "</div>";
				html += '<div class="cbi-value rq-note" style="margin-top:8px"><%:提示：系统级判定反映防火墙转发走向；代理客户端判定反映 socks 全局端点分流。两者可能因运行模式不同而结论不同。%></div>';
				out.innerHTML = html;
			})
			.catch(function(err) {
				var out = document.getElementById("rq_result");
				out.innerHTML = '<div class="cbi-value rq-note" style="color:red">Request failed: ' + rqEsc(String(err)) + "</div>";
			})
			.finally(function() {
				rq_btn.disabled = false;
				rq_btn.value = "<%:查询%>";
			});
	}

	rq_btn.addEventListener("click", rqRun);
	rq_target.addEventListener("keydown", function(e) {
		if (e.key === "Enter" || e.keyCode === 13) {
			e.stopPropagation();
			e.preventDefault();
			rqRun();
		}
	});
	rq_port.addEventListener("keydown", function(e) {
		if (e.key === "Enter" || e.keyCode === 13) {
			e.stopPropagation();
			e.preventDefault();
			rqRun();
		}
	});
	//]]>
</script>
