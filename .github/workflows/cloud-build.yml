name: Cloud Build

on:
  push:


permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Build ${{ matrix.arch }}-${{ matrix.sdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
        sdk:
          - openwrt-24.10

    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 7
          keep_minimum_runs: 3
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.sdk }}
          FEEDNAME: passwall_packages
          PACKAGES: luci-app-passwall
          NO_REFRESH_CHECK: true
          PACKAGES_FEED: https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git
          PACKAGES_BRANCH: main
          PACKAGES_PATH: package/ passwall


      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          retention-days: 7
          name: ${{ matrix.arch }}-${{ matrix.sdk }}
          path: bin/packages/${{ matrix.arch }}/passwall_packages/*.ipk